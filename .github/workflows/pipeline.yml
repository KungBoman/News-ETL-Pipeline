name: CI

on:
    workflow_dispatch:
        schedule:
            - cron: "0 3 * * *"

jobs:
    test:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_DB: news
                    POSTGRES_USER: new_user
                    POSTGRES_PASSWORD: news_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U news_users -d news"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 4

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Create databse schema
              run: |
                  PGPASSWORD=news_password psql \
                  -h localhost \
                  -U news_user \
                  -d news \
                  -f sql/schema.sql

            - name: Run pipeline
              env:
                  DB_HOST: localhols
                  DB_PORT: 5432
                  DB_NAME: news
                  DB_USER: news_user
                  DB_PASSWORD: news_password
              run: python main.py
