name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: news_test
          POSTGRES_USER: news_user
          POSTGRES_PASSWORD: news_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U news_user -d news_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: news_test
          DB_USER: news_user
          DB_PASSWORD: news_password
        run: pytest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build                                                                    \
            -t ghcr.io/${{ github.repository_owner }}/news-etl-api:${{ github.ref_name }} \
            -t ghcr.io/${{ github.repository_owner }}/news-etl-api:latest                 \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/news-etl-api:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository_owner }}/news-etl-api:latest

      - name: Create artifact
        run: |
          zip -r news-etl.zip .  \
            -x ".git/*"          \
            -x ".env"            \
            -x "__pycache__/*"   \
            -x "*/__pycache__/*" \
            -x ".pytest_cache/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: news-etl.zip
